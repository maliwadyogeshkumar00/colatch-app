.db-kpi .kf{font-size:34px;line-height:38px;font-weight:300;letter-spacing:-.03em;color:var(--fig);font-variant-numeric:tabular-nums}
.db-kpi .kf small{font-size:13px;letter-spacing:0;font-weight:400;color:var(--ink-2);margin-left:4px}
.dp{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;background:var(--plum-100);color:var(--plum-700);font-size:12px;font-weight:500;white-space:nowrap}
.dp em{font-style:normal;font-weight:400;color:var(--ink-2)}
:root[data-theme="night"] .dp{background:var(--plum-700);color:var(--on-dark)}
.mb{display:flex;align-items:flex-end;gap:3px;height:34px;flex:none}
.mb i{width:6px;border-radius:2px 2px 0 0;background:var(--plum-300)}
.mb i.g{background:var(--gold-deep)}
.sl{width:110px;flex:none}
.sgb{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;width:100%}
.sgb i{display:block}
.sgl{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--ink-2)}
.sgl i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.md{flex:none}
/* clock */
.db-clock{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px 14px;display:flex;flex-direction:column;gap:8px}
.clk2{position:relative;height:132px;margin:4px 70px 0}
.clk2 .rl{position:absolute;left:0;right:0;top:64px;height:2px;background:var(--line)}
.clk2 .rf{position:absolute;left:0;top:64px;height:2px;background:var(--plum-600)}
.ce{position:absolute;transform:translateX(-50%);width:150px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px}
.ce.hi{bottom:76px}
.ce.lo{top:78px}
.ce i{position:absolute;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--card);border:2px solid var(--plum-300)}
.ce.hi i{bottom:-19px}
.ce.lo i{top:-20px}
.ce.done i{background:var(--plum-600);border-color:var(--plum-600)}
.ce.now i{background:var(--gold);border-color:var(--gold-deep)}
.ce .t{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ce b{font-size:12.5px;line-height:16px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ce.done b{font-weight:400;color:var(--ink-2)}
.clk2 .nw{position:absolute;top:44px;height:42px;width:2px;background:var(--gold-deep);transform:translateX(-50%)}
.clk2 .nw span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);white-space:nowrap;background:var(--card);padding:0 4px;margin-bottom:2px}
.cks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin:0 50px}
/* ledger */
.db-ledger{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0}
.lrow{display:grid;grid-template-columns:34px 40px minmax(0,1.6fr) minmax(110px,.8fr) auto minmax(100px,.7fr) minmax(130px,auto) 18px;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--line-soft);color:inherit;transition:background-color 200ms var(--ease)}
.lrow:hover{background:var(--plum-50)}
:root[data-theme="night"] .lrow:hover{background:var(--tint)}
.lrow .ix{font-size:13px;font-weight:300;color:var(--plum-300);font-variant-numeric:tabular-nums}
.lrow .mono{width:40px;height:40px;border-radius:10px;font-size:13px}
.lrow .nm{min-width:0}
.lrow .nm b{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .nm span,.lrow .st>span:last-child,.lrow .vl span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .st{gap:4px}
.lrow .stg i{width:14px;height:5px}
.lrow .vl b{font-size:14px;font-weight:500;color:var(--fig);font-variant-numeric:tabular-nums}
.lrow .chev{color:var(--plum-300);transition:transform 200ms var(--ease)}
.lrow:hover .chev{transform:translateX(6px);color:var(--plum-600)}
.sd{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.sd i{width:7px;height:7px;border-radius:50%;background:var(--plum-300);position:relative}
.sd.attn{color:var(--ink);font-weight:500}.sd.attn i{background:var(--plum-600)}
.sd.ok i{background:var(--gold-deep)}
@media (prefers-reduced-motion:no-preference){.sd.ok i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--gold-deep);animation:live-ring 2s var(--ease) infinite}}
.sd.wait i{background:transparent;border:1.5px solid var(--plum-500)}
/* talent of the day */
.tod{position:relative;border-radius:18px;overflow:hidden;min-height:300px;display:block;color:#fff;background:var(--plum-900);box-shadow:0 26px 60px rgba(46,27,54,.18)}
.tod .art{position:absolute;inset:0;border-radius:0}
.tod .art .ini{font-size:88px!important;font-weight:300;top:56px;bottom:auto;left:22px;opacity:.9}
.tod .tb{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 20px;display:flex;flex-direction:column;gap:3px;background:linear-gradient(180deg,rgba(46,27,54,0),rgba(46,27,54,.92) 36%)}
.tod .cat{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-bright)}
.tod .tn{font-size:22px;line-height:28px;font-weight:700}
.tod .ts{font-size:12.5px;color:var(--on-dark-2)}
.tod .tr2{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.12);padding-top:10px;margin-top:8px;font-size:13px;color:var(--on-dark-2)}
.tod .tr2 span{display:inline-flex;align-items:center;gap:8px}
.tod .tr2 i{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.tod .tr2 b{font-size:15px;font-weight:500;color:#fff}
.tod:hover .art .o1{transform:scale(1.08)}
/* responsive */
@media (max-width:1180px){.db-row,.db-row.r2{grid-template-columns:minmax(0,1fr)}.db-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.tod{min-height:260px}}
@media (max-width:900px){.lrow{grid-template-columns:28px 36px minmax(0,1fr) auto;row-gap:6px}.lrow .st,.lrow .avs2,.lrow .chev{display:none}.lrow .vl{grid-column:3}.lrow .sd{grid-column:4;grid-row:1}.clk2{margin:4px 50px 0}.ce{width:100px}.ce b{font-size:11.5px}}
@media (max-width:700px){.db-title{font-size:30px;line-height:36px}.strip b{font-size:20px}.strip div{padding:0 14px}.db-head>div:last-child{align-items:flex-start!important}.db-hero{grid-template-columns:minmax(0,1fr)}.db-hero .hr{border-left:0;border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:1fr 1fr}.db-hero .hr div{border-top:1px solid rgba(255,255,255,.07)}.foil .fig{font-size:68px}.db-kpis{grid-template-columns:minmax(0,1fr)}.db-clock{overflow-x:auto}.clk2{min-width:560px}.cks{min-width:560px}.desk li{grid-template-columns:24px minmax(0,1fr)}.desk li .btn{grid-column:2;justify-self:start}}
.lrow{grid-template-columns:34px 40px minmax(0,1fr) 112px 118px 150px 16px}
@media (max-width:900px){.lrow{grid-template-columns:28px 36px minmax(0,1fr) auto}}

/* =========================================================================
   v9 — research rulebook applied ("Dashboard type spacing and charts")
   Type 11/12/13/14/16/20/28 + one 44–48 Light hero on plum · spacing 4-grid,
   24px card padding/gaps at ≥1440 (20 at 1280) · radii 8/12/18/pill ·
   gold never as thin line or text on white.
   ========================================================================= */
:root{ --muted:#6E6477; --ink-3:#6E6477; --side-w:240px; --top-h:64px; }
body{font-size:14px;line-height:20px}

/* ---------- type ---------- */
.display,.db-title{font-size:28px!important;line-height:36px!important;font-weight:400!important;letter-spacing:-.01em!important;max-width:none;margin:0}
.display b,.db-title b{font-weight:500!important;color:var(--plum-700)!important}
:root[data-theme="night"] .display b,:root[data-theme="night"] .db-title b{color:var(--gold-bright)!important}
.hero-title{font-size:28px;line-height:36px;font-weight:400}
.h1{font-size:20px;line-height:28px;font-weight:500;letter-spacing:-.005em}
.h2{font-size:16px;line-height:24px;font-weight:500}
.h1 b,.h2 b,.hero-title b{font-weight:700;color:var(--plum-700)}
.h3{font-size:14px;line-height:20px;font-weight:700}
.lead,.db-lead{font-size:14px;line-height:22px;max-width:70ch}
.meta{font-size:13px;line-height:18px;color:var(--ink-2)}
.eyebrow{font-size:11px;line-height:16px;letter-spacing:.22em;font-weight:400;color:var(--plum-500)}
.eyebrow::before{width:26px}
.lbl,.flabel,.field>label{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.btn,.tabs button,.subnav a,.nav a,.vtab button,.seg button,.room-roles button{font-weight:500}
.btn{font-size:14px;height:40px;padding:0 16px;border-radius:8px}
.btn.sm{font-size:13px;height:32px;padding:0 12px}
.btn.lg{height:48px}
.inp,.sel{height:40px;border-radius:8px;font-size:14px}
.chip{height:32px;font-size:13px}
.pill,.dchip,.dp,.hpill{font-size:12px;line-height:16px;font-weight:500}
.dp,.dchip{height:20px;padding:0 8px;background:var(--plum-50);color:var(--plum-700)}
:root[data-theme="night"] .dp,:root[data-theme="night"] .dchip{background:var(--plum-700);color:var(--on-dark)}
.price{font-variant-numeric:tabular-nums}

/* KPI numerals: 28/32 500 tabular, unit ~58% ink-2 */
.kpi .big,.kpi .fig,.kpi .big.fig,.db-kpi .kf,.b-kpi .kv{font-size:28px!important;line-height:32px!important;font-weight:500!important;letter-spacing:-.01em!important;font-variant-numeric:tabular-nums}
.db-kpi .kf small,.b-kpi .kv small,.kpi .unit{font-size:16px;font-weight:400;color:var(--ink-2)}
.db-kpi .kl,.b-kpi>.meta,.kpi>.meta:first-child{font-size:12px!important;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.db-kpi .kl em{text-transform:none;letter-spacing:0;font-weight:400}
.statbar b{font-size:20px;line-height:28px}
.strip b{font-size:28px;line-height:32px;font-weight:400}
.moneyband .v{font-size:20px;line-height:28px}

/* hero numeral: Light on plum only */
.foil .fig{font-size:56px!important;line-height:60px;letter-spacing:-.03em}
.foil .cur,.foil .u{font-size:28px}
.big2{font-size:44px;line-height:48px;font-weight:300}
.db-hero .hr .v b{font-size:22px}

/* ---------- tables ---------- */
.t{font-size:13px}
.t th{height:40px;padding:0 16px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--card)}
.t td{padding:14px 16px;line-height:20px;border-bottom:1px solid var(--line-soft)}
.t td .meta{font-size:12px;line-height:16px}

/* ---------- shell ---------- */
.side,.side.side{width:240px}
.nav{padding:8px 12px 12px}
.nav .lbl{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.14em;padding:24px 12px 8px;text-transform:uppercase}
.nav a{height:40px;padding:0 12px;gap:12px;font-size:14px}
.nav a svg{width:20px;height:20px}
.nav a+a{margin-top:4px}
.marker{height:40px}
.top{height:64px;padding:0 32px}
.kbar,.ibtn,.top .newbtn{height:40px}
.ibtn{width:40px}
@media (min-width:901px){.app.mini .side{width:72px}}

/* ---------- spacing & radii ---------- */
.view{max-width:1344px;padding:32px 32px 96px;gap:32px}
.daybook{gap:24px}
.card,.db-desk,.db-kpi,.db-clock,.db-ledger,.b-card,.facets,.sgrp,.inline-panel{border-radius:18px}
.pad,.db-desk,.db-kpi,.b-card{padding:24px}
.db-clock{padding:24px 24px 16px}
.db-ledger .lrow{padding:16px 24px}
.db-ledger>.row:first-child{padding:24px 24px 8px!important}
.grid,.db-row,.db-kpis,.b-kpis,.bento,.g4c,.v4-2col,.money-split,.disc-split,.pf,.score-grid{gap:24px}
.kpi{padding:24px;gap:8px}
.kpi .tile,.db-kpi .kt,.ti,.qi .qic,.mono{border-radius:12px}
.drawer .dh,.drawer .db,.drawer .df{padding-left:24px;padding-right:24px}
.modal{border-radius:18px}
.tbl-wrap{border-radius:18px}
.db-hero,.b-hero,.tod{border-radius:18px}
.qi{padding:16px 24px}
.qhead{padding:16px 24px}
.desk li{padding:12px 0}
.ph{gap:16px 32px}

/* ---------- charts ---------- */
.chart text,.achart text{font-size:12px;fill:var(--ink-2)}
.chart line[stroke-dasharray]{stroke:var(--line)}
.xl,.vlab,.cks,.ticks{font-size:12px}
.vbar .b em{font-size:12px}
.vbar .b.br{background:var(--plum-700)}
.vbar .b{border-radius:4px 4px 0 0}
.mb i{border-radius:2px 2px 0 0}
.legend{font-size:12px}

/* ---------- gold never as thin line or small text on white ---------- */
.display b,.db-title b,.hero-title b,.h1 b,.h2 b{color:var(--plum-700)}
.tabs button.on::after{background:var(--plum-900)}
.desk li:first-child .ix{color:var(--plum-900);font-weight:700}
.hlbl2{color:var(--plum-700)}
.pick .rk,.lr .rk.g{color:var(--plum-900)}
.agenda li.now .tm{color:var(--plum-900)}
.agenda li.now{border-top-color:var(--plum-900)}
.clk2 .nw,.clk .nowm{background:var(--plum-900)}
.clk2 .nw span,.clk .nowm span{color:var(--plum-900)}
.cal .cd.today .dn{background:var(--plum-900);color:#fff}
.bdg.gold,.pill.p2{border-color:transparent;background:rgba(232,184,75,.22);color:var(--ink)}
.bdg.gold svg{color:var(--ink)}
.authc.low{border-color:var(--plum-900);background:rgba(232,184,75,.28);color:var(--ink)}
.prm .bar i.low{background:var(--gold)}
.lr:first-child .lb i{background:var(--gold)}
.lb{height:8px}
.funnel .fb i.k{background:var(--gold)}
.linkbox{border-color:var(--plum-300)}
.saved i{background:var(--plum-600)}
.sd.ok i{background:var(--plum-700)}
.sd.ok i::after{background:var(--plum-700)!important}
.eyebrow::before{background:var(--gold-flat)}

/* ---------- responsive reflow ---------- */
@media (max-width:1439px){.view{padding:24px 24px 96px}.pad,.db-desk,.db-kpi,.b-card,.kpi{padding:20px}.grid,.db-row,.db-kpis,.b-kpis,.bento,.g4c,.v4-2col,.money-split,.disc-split,.pf,.score-grid{gap:20px}.top{padding:0 24px}}
@media (max-width:1100px) and (min-width:901px){
  .side{width:72px!important}
  .side .brand .bt,.side .ws,.side .nav .lbl,.side .nav a span:not(.ct),.side .me>div,.side .nav a.pin,.side .brand .col-btn{display:none}
  .side .brand{flex-direction:column;padding:16px}
  .side .nav{padding:8px 12px}
  .side .nav a{justify-content:center;padding:0}
  .side .nav a .ct{position:absolute;top:4px;right:4px;margin:0;min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:var(--plum-900);font-size:10px;display:grid;place-items:center;padding:0 4px}
  .side .nav a .ct:empty{display:none}
  .side .me{justify-content:center;padding:12px 0}.side .me button{display:none}
}
@media (max-width:900px){.side{width:288px!important}.view{padding:20px 20px 96px;gap:24px}.top{padding:0 16px;height:56px}.grid,.db-row,.db-kpis,.b-kpis,.g4c,.pf{gap:16px}.pad,.db-desk,.db-kpi,.b-card,.kpi{padding:16px}}
@media (max-width:640px){.view{padding:16px 16px 96px;gap:20px}.grid,.db-row,.db-kpis,.b-kpis{gap:12px}.db-title,.display{font-size:24px!important;line-height:32px!important}.foil .fig{font-size:48px!important}}

/* =========================================================================
   v10 — Velvet ledger. Night = Plum Night ground, plum-800 cards,
   gold lives on plum: hairline tiles, roundels, foil numerals.
   ========================================================================= */
:root[data-theme="night"]{
  --ground:#1A1020; --card:#2E1B36; --tint:#3A2344; --tint-2:#472B53;
  --line:rgba(255,255,255,.08); --line-soft:rgba(255,255,255,.05);
  --ink:#F8F5F9; --ink-2:#BCA9C6; --muted:#A893B3; --ink-3:#A893B3; --head:#F8F5F9; --fig:#F8F5F9;
  --hair-gold:rgba(232,184,75,.28);
}
:root{ --hair-gold:var(--line); }
:root[data-theme="night"] body{background:radial-gradient(1200px 600px at 85% -10%,rgba(84,54,97,.45),transparent 60%),var(--ground)}
:root[data-theme="night"] .top{background:color-mix(in srgb,#1A1020 82%,transparent)}
:root[data-theme="night"] .card,:root[data-theme="night"] .db-desk,:root[data-theme="night"] .db-clock,:root[data-theme="night"] .db-ledger,:root[data-theme="night"] .facets,:root[data-theme="night"] .tbl-wrap,:root[data-theme="night"] .sgrp{background:#24152B;border-color:var(--line);box-shadow:none}
/* gold-hairline tiles */
:root[data-theme="night"] .db-kpi,:root[data-theme="night"] .kpi,:root[data-theme="night"] .statbar{background:linear-gradient(180deg,rgba(58,35,68,.9),rgba(36,21,43,.9));border:1px solid var(--hair-gold)}
:root[data-theme="night"] .db-kpi .kt,:root[data-theme="night"] .kpi .tile{background:transparent;border:1px solid var(--hair-gold);color:var(--gold-bright)}
:root[data-theme="night"] .db-kpi .kl,:root[data-theme="night"] .kpi .top-row span{color:var(--gold-bright)!important}
:root[data-theme="night"] .db-kpi .kf{font-weight:300!important;font-size:32px!important;letter-spacing:-.02em!important}
.db-kpi .kf sup{font-size:.5em;vertical-align:.7em;margin-right:2px;font-weight:400;color:var(--plum-500)}
:root[data-theme="night"] .db-kpi .kf sup{color:var(--gold)}
:root[data-theme="night"] .dp,:root[data-theme="night"] .dchip{background:rgba(232,184,75,.12);color:var(--gold-bright)}
:root[data-theme="night"] .dp em,:root[data-theme="night"] .dchip em{color:var(--on-dark-2)}
:root[data-theme="night"] .mb i{background:var(--plum-500)}
:root[data-theme="night"] .mb i.g{background:var(--gold)}
/* headline */
:root[data-theme="night"] .db-title{font-weight:300!important}
:root[data-theme="night"] .db-title b,:root[data-theme="night"] .display b{color:var(--gold)!important;font-weight:500!important}
:root[data-theme="night"] .db-lead b{color:#fff}
:root[data-theme="night"] .strip b{color:#fff;font-weight:300}
:root[data-theme="night"] .strip div{border-left-color:var(--hair-gold)}
/* desk */
:root[data-theme="night"] .desk li:first-child .ix{color:var(--gold)}
:root[data-theme="night"] .desk .ix{color:var(--plum-400)}
:root[data-theme="night"] .lnk{color:var(--gold-bright)}
:root[data-theme="night"] .db-desk .row .lnk{color:var(--gold-bright)}
:root[data-theme="night"] .btn.pri{background:var(--gold-flat);color:var(--plum-900);box-shadow:none}
:root[data-theme="night"] .btn.out{background:transparent;border-color:rgba(255,255,255,.18);color:var(--on-dark)}
:root[data-theme="night"] .btn.out:hover{border-color:var(--gold)}
/* gold monogram roundels */
.mono{border-radius:50%!important}
:root[data-theme="night"] .mono{background:transparent;border:1px solid var(--gold-deep);color:var(--gold-bright);font-weight:500;letter-spacing:.08em}
:root[data-theme="night"] .lrow:hover{background:rgba(232,184,75,.05)}
:root[data-theme="night"] .lrow .ix{color:var(--plum-400)}
:root[data-theme="night"] .sd.attn i,:root[data-theme="night"] .sd.ok i{background:var(--gold)}
:root[data-theme="night"] .sd.ok i::after{background:var(--gold)!important}
/* plum → gold progress */
.gprog{display:block;height:6px;border-radius:3px;background:var(--tint-2);overflow:hidden;width:100%}
.gprog i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--plum-500),var(--plum-700))}
:root[data-theme="night"] .gprog{background:rgba(255,255,255,.08)}
:root[data-theme="night"] .gprog i{background:linear-gradient(90deg,var(--plum-500),var(--gold))}
:root[data-theme="night"] .meter{background:rgba(255,255,255,.08)}
:root[data-theme="night"] .meter>i,:root[data-theme="night"] .lb i{background:linear-gradient(90deg,var(--plum-500),var(--gold))}
/* clock */
:root[data-theme="night"] .clk2 .rl{background:rgba(255,255,255,.1)}
:root[data-theme="night"] .clk2 .rf{background:linear-gradient(90deg,var(--plum-500),var(--gold))}
:root[data-theme="night"] .clk2 .nw{background:var(--gold)}
:root[data-theme="night"] .clk2 .nw span{color:var(--gold-bright);background:#24152B}

/* talent rail */

.vb2{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:14px;display:flex;flex-direction:column;gap:2px;background:linear-gradient(180deg,rgba(46,27,54,0),rgba(46,27,54,.94) 40%)}

.vm span:last-child{color:#fff}
/* hero panel deeper in night */
:root[data-theme="night"] .db-hero{border:1px solid var(--hair-gold);background:linear-gradient(160deg,#3A2344 0%,#2E1B36 55%,#24152B 100%)}
:root[data-theme="night"] .tod{border:1px solid var(--hair-gold)}
/* tables, tabs, subnav in night */
:root[data-theme="night"] .t th{background:#24152B;color:var(--gold-bright)}
:root[data-theme="night"] .tabs button.on::after{background:var(--gold)}
:root[data-theme="night"] .subnav,:root[data-theme="night"] .vtab,:root[data-theme="night"] .seg{background:#24152B;border-color:var(--line)}
:root[data-theme="night"] .subnav a.on,:root[data-theme="night"] .vtab button.on,:root[data-theme="night"] .seg button.on,:root[data-theme="night"] .chip.on{background:var(--gold-flat);color:var(--plum-900);border-color:transparent}
:root[data-theme="night"] .subnav a.on .n{color:var(--plum-900)}
:root[data-theme="night"] .chip{background:transparent;border-color:rgba(255,255,255,.14);color:var(--on-dark)}
:root[data-theme="night"] .inp,:root[data-theme="night"] .sel,:root[data-theme="night"] .kbar,:root[data-theme="night"] .ibtn{background:#24152B;border-color:rgba(255,255,255,.12);color:var(--on-dark)}
:root[data-theme="night"] .omni{background:#24152B;border-color:var(--hair-gold)}
:root[data-theme="night"] .pill.p1,:root[data-theme="night"] .dtype{background:rgba(255,255,255,.08);color:var(--on-dark)}
:root[data-theme="night"] .eyebrow{color:var(--gold-bright)}
:root[data-theme="night"] .authc{border-color:var(--gold);color:var(--gold-bright)}
:root[data-theme="night"] .cc .price,:root[data-theme="night"] .price{color:#fff}
:root[data-theme="night"] .marker{background:rgba(232,184,75,.12)}
@media (max-width:1180px){.vtiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.vtiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
/* talent rail status */
.vs{position:absolute;top:12px;left:12px;z-index:2;display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;background:rgba(26,16,32,.72);font-size:11.5px;color:#fff;backdrop-filter:blur(6px)}
.vs i{width:6px;height:6px;border-radius:50%;background:var(--plum-300)}
.vs.live i{background:var(--gold);box-shadow:0 0 0 3px rgba(232,184,75,.25)}
.vt .vr{top:auto;bottom:auto;top:44px;right:auto;left:14px;display:none}
/* clock NOW label sits below the rail, clear of events */
.clk2{margin-top:12px}
.clk2 .nw{top:52px;height:28px}
.clk2 .nw span{bottom:auto;top:calc(100% + 66px);margin:0}
/* creator cover hero (Nixtio / Oliver Bennet pattern, in brand) */
.pcover{background:radial-gradient(700px 400px at 90% -20%,rgba(232,184,75,.18),transparent 60%),linear-gradient(160deg,#3A2344,#2E1B36 60%,#24152B)!important;border:1px solid rgba(232,184,75,.28)!important;color:#F8F5F9}
.pcover .pfh{grid-template-columns:200px minmax(0,1fr);gap:32px;padding:28px;align-items:end}
.pcover .pfav{width:200px;height:260px;border-radius:18px;padding:3px;background:linear-gradient(160deg,var(--gold-bright),var(--gold-deep) 40%,var(--plum-600))}
.pcover .pfav.plain{background:rgba(255,255,255,.12)}
.pcover .pfav>div{border-radius:15px;border:0}
.pcover .pfav .art{border-radius:15px}
.pcover .pfav .art .ini{font-size:72px!important;font-weight:300;left:20px!important;top:auto;bottom:16px!important;transform:none}
.pcover .pfn h1{font-size:40px;line-height:44px;font-weight:300;color:#fff;letter-spacing:-.025em}
.pcover .pfn h1 b{font-weight:700}
.pcover .pfn .hd{color:var(--gold-bright)}
.pcover .pfn .vb{background:var(--gold);color:var(--plum-900)}
.pcover .meta,.pcover .pfbio{color:var(--on-dark-2)}
.pcover .igstats div{color:var(--on-dark-2)}
.pcover .igstats b{color:#fff;font-size:20px;font-weight:500}
.pcover .bdg{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#F8F5F9}
.pcover .bdg svg{color:var(--gold-bright)}
.pcover .bdg.gold{background:rgba(232,184,75,.16);color:var(--gold-bright);border-color:rgba(232,184,75,.4)}
.pcover .btn.out{background:transparent;border-color:rgba(255,255,255,.2);color:#fff}
.pcover .btn.pri{background:var(--gold-flat);color:var(--plum-900)}
.pcover .statbar{border-top:1px solid rgba(232,184,75,.22);background:rgba(26,16,32,.35)!important;border-left:0;border-right:0;border-bottom:0}
.pcover .statbar div{border-right-color:rgba(255,255,255,.08)}
.pcover .statbar b{color:#fff;font-weight:300;font-size:24px}
.pcover .statbar span{color:var(--gold-bright);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
@media (max-width:900px){.pcover .pfh{grid-template-columns:120px minmax(0,1fr);gap:16px;padding:16px;align-items:start}.pcover .pfav{width:120px;height:156px}.pcover .pfn h1{font-size:28px;line-height:32px}.pcover .pfav .art .ini{font-size:40px!important}}
@media (max-width:640px){.pcover .pfh{grid-template-columns:1fr}}
/* discover: portrait-led cards */
.cc .art{height:180px}

/* v11 — map, radar, bento gallery */
.db-map{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:32px;align-items:center;padding:24px 32px;border-radius:18px;border:1px solid var(--hair-gold,var(--line));background:var(--card);position:relative;overflow:hidden}
:root[data-theme="night"] .db-map{background:radial-gradient(600px 400px at 15% 50%,rgba(84,54,97,.5),transparent 70%),#24152B}
.imap{width:100%;height:auto;display:block;overflow:visible}
.imap .dots circle{fill:var(--plum-200)}
:root[data-theme="night"] .imap .dots circle{fill:rgba(188,169,198,.28)}
.imap .node .core{fill:var(--plum-700)}
.imap .node .halo{fill:var(--plum-700);opacity:.14}
.imap .node.top .core{fill:var(--gold)}
.imap .node.top .halo{fill:var(--gold);opacity:.25}
:root[data-theme="night"] .imap .node .core{fill:var(--gold)}
:root[data-theme="night"] .imap .node .halo{fill:var(--gold);opacity:.18}
.imap text{font-family:var(--font);font-size:11px;fill:var(--ink);font-weight:500}
@media (prefers-reduced-motion:no-preference){.imap .node.top .halo{animation:halo 2.4s var(--ease) infinite;transform-box:fill-box;transform-origin:center}}
@keyframes halo{0%{transform:scale(.7);opacity:.35}100%{transform:scale(1.5);opacity:0}}
.mapr{display:flex;flex-direction:column;gap:16px;min-width:0}
.cityl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cityl li{display:grid;grid-template-columns:28px 110px minmax(0,1fr) 56px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.cityl li:first-child{border-top:0}
.cityl .ix{font-size:12px;color:var(--plum-400);font-variant-numeric:tabular-nums}
.cityl b{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.radarw{display:flex;justify-content:center;margin:4px 0}
.radar{width:100%;max-width:320px;height:auto;overflow:visible}
.radar .rg{fill:none;stroke:var(--line)}
.radar .sp{stroke:var(--line)}
.radar .ar{fill:rgba(84,54,97,.18);stroke:var(--plum-700);stroke-width:2}
:root[data-theme="night"] .radar .ar{fill:rgba(232,184,75,.16);stroke:var(--gold)}
.radar .vx{fill:var(--plum-700)}
:root[data-theme="night"] .radar .vx{fill:var(--gold)}
.radar text{font-family:var(--font);font-size:11px;fill:var(--ink-2)}
.radar .lv{font-weight:700;fill:var(--ink);font-size:12px}
.iggrid.bento{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:auto}
.iggrid.bento .igt:first-child{grid-column:span 2;grid-row:span 2}
.iggrid.bento .igt:first-child .cap{font-size:20px;line-height:26px;font-weight:700;top:auto;bottom:44px}
.iggrid.bento .igt:nth-child(n+6){display:none}
.iggrid.bento{gap:8px}
.igt{border-radius:12px}
.mapmini{max-width:240px;margin:0 auto 8px}
@media (max-width:900px){.db-map{grid-template-columns:minmax(0,1fr);padding:20px}.mapl{max-width:300px;margin:0 auto}.cityl li{grid-template-columns:24px 90px minmax(0,1fr) 48px}}

/* ============================================================
   v12 — wireframe parity components
   ============================================================ */
/* credits meter in the rail */
.v12-cred{display:grid;gap:6px;margin:14px 6px 4px;padding:12px 12px 10px;border:1px solid var(--line);border-radius:12px;color:var(--ink-2);font-size:12.5px;text-decoration:none;background:var(--card)}
.v12-cred:hover{border-color:var(--plum-300)}
.v12-cred{cursor:pointer}.v12-cr1{display:flex;justify-content:space-between;align-items:center;gap:8px}.v12-cr2{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.v12-cred b{color:var(--ink);font-weight:500}
.v12-cred .bar,.v12-bar{display:block;height:4px;border-radius:999px;background:var(--line);overflow:hidden}
.v12-cred .bar i,.v12-bar i{display:block;height:100%;background:var(--gold-flat);border-radius:inherit}
.v12-cred.low .bar i{background:var(--plum-600)}
.v12-cred .meta{font-size:11px}
.app.mini .v12-cred{display:none}
.v12-pack{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 16px;border-radius:12px;background:var(--tint)}

/* AI Scout layout */
.v12-scout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
.v12-hist{position:sticky;top:84px;display:flex;flex-direction:column;gap:6px;padding:14px;max-height:calc(100vh - 110px);overflow:auto}
.v12-hi{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:2px;border-radius:10px}
.v12-hi a{display:block;padding:8px 8px;border-radius:10px;color:var(--ink);font-size:13px;line-height:1.35;text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis}
.v12-hi a small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.v12-hi.on a,.v12-hi a:hover{background:var(--tint)}
.v12-hi .ic{opacity:0;transition:opacity var(--dur)}
.v12-hi:hover .ic,.v12-hi .ic:focus-visible{opacity:1}
.ic.sm{width:28px;height:28px}
.ic.on{color:var(--gold-deep);background:var(--tint)}
.v12-ask{padding:32px;display:flex;flex-direction:column;gap:20px}
.v12-h{font-size:clamp(28px,3vw,40px);font-weight:400;letter-spacing:-.02em;margin:0;line-height:1.1}
.v12-h b{font-weight:700;color:var(--plum-600)}
[data-theme="night"] .v12-h b{color:var(--gold-bright)}
.v12-prompt{min-height:120px;font-size:16px;line-height:1.5;padding:16px}
.v12-ctx{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--tint);font-size:13px;color:var(--ink-2)}
.v12-ctx .sel{width:auto}
.v12-try{border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;text-align:left;cursor:pointer;line-height:1.35}
.v12-try:hover{border-color:var(--plum-400);color:var(--ink)}
.v12-try.sm{padding:6px 12px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--card);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--plum-600);color:#fff}
.v12-said{margin:0;font-size:15px;color:var(--ink);line-height:1.45}
.v12-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--chip-bg,var(--tint));border:1px solid var(--line);font-size:12.5px;color:var(--ink)}
.v12-chip.q{border-style:dashed}
.v12-chip i{font-style:normal;font-weight:700;color:var(--gold-deep);font-size:11px}
.v12-chip button{border:0;background:none;display:grid;place-items:center;width:20px;height:20px;border-radius:999px;color:var(--muted);cursor:pointer}
.v12-chip button:hover{background:var(--line);color:var(--ink)}
.v12-sum{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:13.5px;color:var(--ink-2)}
.v12-sum b{color:var(--ink);font-weight:500}
.v12-relax{margin-left:6px;padding:2px 10px;border-radius:999px;background:var(--goldbg,rgba(212,168,74,.14));color:var(--gold-deep);font-size:12px}
.v12-row{display:grid;grid-template-columns:28px minmax(180px,1.1fr) minmax(260px,1.4fr) 76px auto;grid-template-areas:"cb who mx score act" "cb why why why why";gap:6px 16px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);transition:border-color var(--dur)}
.v12-row:hover{border-color:var(--plum-300)}
.v12-row.on{border-color:var(--plum-600);box-shadow:0 0 0 1px var(--plum-600)}
.v12-cb{grid-area:cb;align-self:start;padding-top:12px}
.v12-cb input{width:16px;height:16px;accent-color:var(--plum-600)}
.v12-cb span{display:none}
.v12-who{grid-area:who;display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none;min-width:0}
.v12-who b{display:flex;align-items:center;gap:4px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v12-who .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.v12-mx{grid-area:mx;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.v12-mx span{display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
.v12-mx b{font-size:15px;color:var(--ink);font-weight:500}
.v12-why{grid-area:why;font-size:13px;color:var(--ink-2);padding-left:56px}
.v12-why .lbl{display:inline;margin-right:4px}
.v12-score{grid-area:score;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;border:2px solid var(--gold-flat);cursor:help;outline-offset:3px}
.v12-score b{font-size:22px;line-height:1;color:var(--ink);font-weight:500}
.v12-score>span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.v12-score .tip{position:absolute;z-index:20;right:0;top:calc(100% + 8px);width:220px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-md);display:none;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.v12-score:hover .tip,.v12-score:focus .tip{display:flex}
.v12-score .tip .bar{display:block;height:3px;border-radius:999px;background:var(--line);margin-bottom:4px}
.v12-score .tip .bar i{display:block;height:100%;background:var(--plum-500);border-radius:inherit}
.v12-act{grid-area:act;display:flex;gap:4px;align-items:center}
.v12-empty{text-align:center;align-items:center;padding:40px}
.v12-celebs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.v12-cel{display:flex;flex-direction:column;gap:4px;color:inherit;text-decoration:none;padding:8px;border-radius:12px;border:1px solid var(--line)}
.v12-cel:hover{border-color:var(--plum-300)}
.v12-cel.cf{opacity:.75}
.v12-cel b{font-weight:500;font-size:14px}
.v12-cel .meta{font-size:12px}
.v12-refine{background:var(--tint)}
.v12-refine .inp{background:var(--card)}
.v12-turn{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.v12-turn .u{align-self:flex-end;background:var(--plum-600);color:#fff;padding:8px 12px;border-radius:14px 14px 4px 14px;max-width:70%}
.v12-turn .ai{display:flex;gap:8px;align-items:flex-start;color:var(--ink-2)}
.v12-bulk{border:1px solid var(--gold-flat);position:sticky;bottom:16px;z-index:15;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:var(--plum-900);color:#fff;box-shadow:var(--shadow-lg)}
.v12-bulk b{margin-right:8px;font-weight:500}
.v12-bulk .btn{color:#fff;border-color:rgba(255,255,255,.28)}
.v12-bulk .btn:hover{border-color:var(--gold-bright)}
.v12-busy b{display:flex;gap:8px;align-items:center;font-weight:500}
.v12-sk{display:grid;grid-template-columns:44px 1fr 1fr;gap:12px;align-items:center}
.v12-sk span{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line) 0,var(--tint) 50%,var(--line) 100%);background-size:200% 100%;animation:v12sh 1.2s linear infinite}
.v12-sk .a{width:44px;height:44px;border-radius:50%}
@keyframes v12sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.v12-sk span{animation:none}}

/* day book ask bar */
.v12-dbask{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 10px 10px 18px;border-radius:16px;border:1px solid var(--line);background:var(--card);margin-bottom:20px;box-shadow:var(--shadow-sm)}

.v12-parse tr.miss .inp{border-color:var(--plum-600)}

/* audience credibility */
.v12-cred3{display:flex;flex-direction:column;gap:14px}
.v12-stack{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--line)}

.v12-stack .r,.sw.r{background:var(--plum-600)}
.v12-stack .s,.sw.s{background:var(--gold-flat)}

.sw{width:10px;height:10px;border-radius:3px}
.v12-aff{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:13px}

.v12-aff .bar i{display:block;height:100%;background:var(--plum-500);border-radius:inherit}
.v12-aff b{text-align:right;font-weight:500}
.v12-ovl{display:flex;gap:12px;align-items:baseline;padding:12px 14px;border-radius:12px;background:var(--tint);font-size:13px;color:var(--ink-2)}
.v12-ovl b{font-size:26px;color:var(--ink);font-weight:500}

/* compare */
.v12-mtx td,.v12-mtx th{text-align:center}
.v12-mtx td.self{color:var(--muted)}
.v12-mtx td.hi{background:var(--tint);color:var(--plum-600);font-weight:500}
.v12-rec{padding:14px 16px;border-radius:12px;border:1px solid var(--gold-flat);background:var(--card)}
.v12-rec p{margin:6px 0 0;font-size:14px;line-height:1.5}

/* managed tracker */
.v12-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;position:relative}
.v12-steps li{display:flex;flex-direction:column;gap:4px;font-size:12.5px;position:relative;padding-top:2px}
.v12-steps li::before{content:"";position:absolute;top:15px;left:32px;right:-8px;height:2px;background:var(--line)}
.v12-steps li:last-child::before{display:none}
.v12-steps li.done::before{background:var(--plum-600)}
.v12-steps .dot{position:relative;z-index:1;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
.v12-steps li.done .dot{background:var(--plum-600);border-color:var(--plum-600);color:#fff}
.v12-steps li.now .dot{border-color:var(--gold-flat);color:var(--ink);box-shadow:0 0 0 4px rgba(212,168,74,.18)}
.v12-steps b{font-weight:500;line-height:1.25}
.v12-steps .meta{font-size:11px}
.v12-action{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:12px;background:var(--tint)}
.v12-action .n{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--plum-600);color:#fff;font-weight:500;font-variant-numeric:tabular-nums}
.v12-action.ok{color:var(--ink)}
.v12-mini{display:flex;gap:14px;align-items:center;padding:10px 4px;border-top:1px solid var(--line-soft);color:inherit;text-decoration:none;font-size:13.5px;flex-wrap:wrap}
.v12-mini b{font-weight:500}
.v12-ministeps{display:inline-flex;gap:3px}
.v12-ministeps i{width:18px;height:4px;border-radius:999px;background:var(--line)}
.v12-ministeps i.d{background:var(--plum-600)}
.v12-ministeps i.n{background:var(--gold-flat)}

/* inbox */
.v12-quote{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--gold-flat);background:var(--card)}
.v12-quote b.num{font-size:20px;font-weight:500}
.v12-sugg{align-items:center}
.v12-mail{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--tint);display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.v12-mail p{margin:0;line-height:1.55;color:var(--ink-2)}

/* celebrities */
.v12-cbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.v12-fit{font-size:30px;font-weight:500;color:var(--gold-deep)}
.v12-radio{display:inline-flex}
.v12-radio input{position:absolute;opacity:0;pointer-events:none}
.v12-radio span{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;cursor:pointer}
.v12-radio input:checked+span{background:var(--plum-600);border-color:var(--plum-600);color:#fff}
.v12-radio input:focus-visible+span{outline:2px solid var(--gold-flat);outline-offset:2px}

/* desk */
.v12-sla{font-size:12.5px;color:var(--ink-2)}
.v12-sla.hot{color:var(--plum-600);font-weight:500}
[data-theme="night"] .v12-sla.hot{color:var(--gold-bright)}
.v12-kpi{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:10px;background:var(--tint)}
.v12-kpi b{font-size:22px;font-weight:500}

/* documents */
.v12-doc{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:12px;background:var(--tint);font-size:13.5px}
.v12-sig{font-size:20px;letter-spacing:.02em}

/* settings */
.v12-set{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.v12-snav{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
.v12-snav a{padding:8px 12px;border-radius:10px;color:var(--ink-2);font-size:13.5px;text-decoration:none}
.v12-snav a:hover{background:var(--tint);color:var(--ink)}
.v12-snav a.on{background:var(--tint);color:var(--ink);box-shadow:inset 2px 0 0 var(--plum-600);font-weight:500}
.v12-tab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);font-size:13px;text-decoration:none}
.v12-tab.on{background:var(--plum-600);border-color:var(--plum-600);color:#fff}
.v12-tog{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font:inherit;font-size:13px;cursor:pointer}
.v12-tog.on{background:var(--plum-600);border-color:var(--plum-600);color:#fff}
.v12-ints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.v12-key{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:10px;border:1px dashed var(--gold-flat)}
.v12-key code{font-size:14px;word-break:break-all}
.v12-perm td,.v12-perm th{text-align:center}
.v12-perm td:first-child,.v12-perm th:first-child{text-align:left}
.v12-ob{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.v12-ob li{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding-top:8px;border-top:2px solid var(--line)}
.v12-ob li span{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);font-size:11px}
.v12-ob li.d{border-color:var(--plum-600);color:var(--ink)}
.v12-ob li.n{border-color:var(--gold-flat);color:var(--ink);font-weight:500}

@media (max-width:1100px){
  .v12-scout{grid-template-columns:1fr}
  .v12-hist{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;align-items:center}
  .v12-hist .lbl{display:none}
  .v12-hi{flex:0 0 auto}
  .v12-row{grid-template-columns:24px minmax(0,1fr) 64px;grid-template-areas:"cb who score" "cb mx mx" "cb why why" "cb act act"}
  .v12-why{padding-left:0}
  .v12-celebs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .v12-steps{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:16px}
  .v12-steps li::before{display:none}
  .v12-set{grid-template-columns:1fr}
  .v12-snav{position:static;flex-direction:row;flex-wrap:wrap}
  .v12-ints{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .v12-ask{padding:20px}

  .v12-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .v12-ints{grid-template-columns:1fr}
  .v12-dbask{grid-template-columns:auto 1fr}

  .v12-ob{grid-template-columns:repeat(2,1fr)}
  .v12-aff{grid-template-columns:90px 1fr 40px}
}

A.listToPlan = function(el){ var l = getList(el.dataset.l); var id = 'p' + Date.now(); S.plans.unshift({ id: id, name: l.name + ' · plan', client: DATA.CLIENTS[0].name, markup: 20, gst: true, stage: 'Draft', created: new Date().getDate() + ' ' + DATA.MONTHS[new Date().getMonth()], budget: 1000000, rows: l.ids.map(function(cid){ return { cid: cid, deliv: 'Reel', qty: 1, inf: DATA.byId(cid).priceReel, brand: null, client: 'Pending', stage: 'Shortlisted', comment: '', last: '—', channel: 'WhatsApp' }; }) }); save(); toast('Plan created with ' + l.ids.length + ' creators at 20% markup.', 'layers'); go('plan/' + id); };

/* ---------------- PLANS ---------------- */
ROUTES.plans = function(){
  var tAll = S.plans.reduce(function(a, p){ var t = planTotals(p); a.brand += t.brand; a.margin += t.margin; return a; }, { brand: 0, margin: 0 });
  var head = pageHead('Plans · ' + S.plans.length + ' media plans', 'Every plan shows its <b>margin</b> before it ships.', 'Influencer price, brand price and margin sit in one row. Clients see a swipe link with brand prices only; you see the ledger.',
    '<div class="stat-strip"><div><span class="big">' + U.money(tAll.brand).replace('₹ ', '₹') + '</span><span class="meta">brand value across plans</span></div><div><span class="big">' + (tAll.brand ? (tAll.margin / tAll.brand * 100).toFixed(1) : 0) + '<span class="unit">%</span></span><span class="meta">blended gross margin</span></div></div>');
  var grid = '<div class="grid g2">' + S.plans.map(function(p, i){ var t = planTotals(p); var ap = p.rows.filter(function(r){ return r.client === 'Approved'; }).length;
    return '<a href="#/plan/' + p.id + '" class="card pad col gap16 lift reveal" style="--i:' + i + ';color:inherit"><div class="row between"><span class="lbl">' + e(p.client) + '</span>' + pill(p.stage, p.stage === 'Draft' ? 'p4' : 'p2') + '</div><span class="h2">' + e(p.name) + '</span>' +
      '<div class="grid" style="grid-template-columns:repeat(4,1fr);gap:12px">' + [['Creators', p.rows.length], ['Brand value', U.money(t.brand)], ['Margin', (t.mPct * 100).toFixed(1) + '%'], ['CPV', '₹' + t.cpv.toFixed(2)]].map(function(s){ return '<div class="col"><span class="meta" style="font-size:12px">' + s[0] + '</span><b class="num" style="font-size:17px;color:var(--fig);font-weight:500">' + s[1] + '</b></div>'; }).join('') + '</div>' +
      '<div class="col gap8"><div class="stack"><i style="width:' + (ap / p.rows.length * 100) + '%;background:var(--plum-700)"></i><i style="width:' + (p.rows.filter(function(r){ return r.client === 'Maybe'; }).length / p.rows.length * 100) + '%;background:var(--plum-400)"></i></div><span class="meta" style="font-size:12px">' + ap + ' approved by client · created ' + e(p.created) + '</span></div></a>'; }).join('') +
    '<button class="card pad col gap12 lift" style="border-style:dashed;align-items:flex-start;justify-content:center;cursor:pointer;background:transparent;text-align:left" data-a="newPlan"><span class="tile" style="width:40px;height:40px;border-radius:10px;background:var(--plum-100);color:var(--plum-600);display:grid;place-items:center">' + ic('plus', 20) + '</span><span class="h3">Start a plan</span><span class="muted">From a shortlist, from Discover, or empty.</span></button></div>';
  return { title: 'Plans', crumb: 'Run / <b>Plans</b>', html: head + grid };
};
A.newPlan = function(){ openOverlay({ type: 'newPlan' }); };
OVERLAYS.newPlan = function(){ return { kind: 'modal', label: 'New plan', html: '<form class="pad col gap16" data-sub="createPlan"><div class="row between"><span class="h2">Start a plan</span><button type="button" class="ic" data-a="closeOverlay" aria-label="Close">' + ic('x') + '</button></div><div class="field"><label for="npName">Plan name</label><input class="inp" id="npName" required placeholder="e.g. Diwali gifting · Gujarat" autofocus></div><div class="grid" style="grid-template-columns:1fr 1fr;gap:16px"><div class="field"><label for="npClient">Client</label><select class="sel" id="npClient">' + DATA.CLIENTS.map(function(c){ return '<option>' + e(c.name) + '</option>'; }).join('') + '</select></div><div class="field"><label for="npMk">Markup %</label><input class="inp" id="npMk" type="number" min="0" max="80" value="20"></div></div><div class="field"><label for="npFrom">Start from</label><select class="sel" id="npFrom"><option value="">Empty plan</option>' + S.lists.map(function(l){ return '<option value="' + l.id + '">' + e(l.name) + ' (' + l.ids.length + ')</option>'; }).join('') + '</select></div><div class="row gap12" style="justify-content:flex-end"><button type="button" class="btn out" data-a="closeOverlay">Cancel</button><button class="btn pri" type="submit">Create plan</button></div></form>' }; };
A.createPlan = function(){ var name = document.getElementById('npName').value.trim(); if (!name) return; var from = document.getElementById('npFrom').value; var ids = from ? getList(from).ids : []; var id = 'p' + Date.now();
  S.plans.unshift({ id: id, name: name, client: document.getElementById('npClient').value, markup: +document.getElementById('npMk').value || 20, gst: true, stage: 'Draft', created: new Date().getDate() + ' ' + DATA.MONTHS[new Date().getMonth()], budget: 1000000, rows: ids.map(function(cid){ return { cid: cid, deliv: 'Reel', qty: 1, inf: DATA.byId(cid).priceReel, brand: null, client: 'Pending', stage: 'Shortlisted', comment: '', last: '—', channel: 'WhatsApp' }; }) });

var DELIVS = ['Reel', 'Story', 'Reel + stories', 'YouTube', 'UGC'];
var STAGES = ['Shortlisted', 'Reached out', 'Negotiating', 'Contracted', 'Live', 'Paid'];
function getPlan(id){ return S.plans.filter(function(p){ return p.id === id; })[0]; }
function pkgFor(c, deliv){ var k = { Reel: 'reel', Story: 'story', 'Reel + stories': 'combo', YouTube: 'yt', UGC: 'ugc' }[deliv]; var p = c.packages.filter(function(x){ return x.id === k; })[0]; return p ? p.price : c.priceReel; }
ROUTES.plan = function(r){

  var t = planTotals(p), view = S.ui.planView, preset = S.ui.preset;
  var clientCls = { Approved: 'p1', Maybe: 'p2', Pass: 'p3', Pending: 'p4' };
  var head = '<a href="#/plans" class="row gap8 meta" style="width:max-content">' + ic('arrowL', 15) + 'All plans</a>' +

    '<div class="card kpi"><span class="meta">Creator cost</span><span class="big" style="font-size:31px">' + U.money(t.inf).replace('₹ ', '₹') + '</span><span class="meta" style="font-size:12px">what creators receive, before TDS</span></div>' +
    '<div class="card kpi"><span class="meta">Gross margin</span><span class="big gold" style="font-size:31px;color:var(--gold-deep)">' + U.money(t.margin).replace('₹ ', '₹') + '</span><span class="delta">' + (t.mPct * 100).toFixed(1) + '% of brand value</span></div>' +
    '<div class="card kpi"><span class="meta">Markup rule</span><div class="row gap12"><span class="big" style="font-size:31px" id="mkLabel">' + p.markup + '<span class="unit">%</span></span></div><input type="range" class="range" min="0" max="60" step="1" value="' + p.markup + '" data-in="markupLive" data-ch="markup" data-p="' + p.id + '" aria-label="Markup percent"><span class="meta" style="font-size:12px">Applies to rows without a manual brand price</span></div></section>';
  var body;
  if (view === 'story'){
    body = '<div class="grid g3">' + p.rows.map(function(rw, i){ var x = planRow(p, rw); return '<article class="card lift reveal" style="--i:' + Math.min(i, 6) + ';overflow:hidden;border-radius:18px">' + art(x.c.seed, { ini: U.initials(x.c.name), tag: rw.client.toUpperCase(), no: U.pad(i + 1, 2), style: 'aspect-ratio:16/9' }) + '<div class="pad col gap12"><div class="row between"><b style="font-size:17px">' + e(x.c.name) + '</b>' + pill(rw.client, clientCls[rw.client]) + '</div><span class="meta">' + e(catLabel(x.c.cat)) + ' · ' + e(x.c.city) + ' · ' + e(rw.deliv) + '</span><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px">' + [['Brand price', U.money(x.brand)], ['Est. views', U.short(x.c.medViews)], ['Authenticity', x.c.auth]].map(function(s){ return '<div class="col"><span class="meta" style="font-size:11.5px">' + s[0] + '</span><b class="num" style="color:var(--fig);font-weight:500">' + s[1] + '</b></div>'; }).join('') + '</div></div></article>'; }).join('') + '</div>';
  } else {

    var cols = presets[preset];

    var rows = p.rows.map(function(rw, i){ var x = planRow(p, rw), c = x.c; var lc = lineCalc(x.inf); var thr = S.threads.filter(function(tt){ return tt.cid === c.id; })[0]; var esc = S.ledger.filter(function(m){ return m.cid === c.id; })[0];

        : preset === 'performance' ? ['<td class="num">' + U.short(c.medViews) + '</td>', '<td class="num">₹' + x.cpv.toFixed(2) + '</td>', '<td class="num">' + U.pct(c.er) + '</td>', '<td class="num"><span class="auth" style="justify-content:flex-end">' + ring(c.auth, 20) + c.auth + '</span></td>']
        : preset === 'outreach' ? ['<td>' + e(rw.channel) + '</td>', '<td class="meta">' + e(rw.last) + '</td>', '<td>' + (thr ? '<a href="#/inbox/' + thr.id + '">' + (thr.unread ? thr.unread + ' new · ' : '') + e(thr.topic) + '</a>' : '<span class="meta">No thread yet</span>') + '</td>']
        : ['<td><input class="inp sm" style="min-width:220px" value="' + e(rw.comment) + '" placeholder="No comment" data-ch="rowComment" data-p="' + p.id + '" data-i="' + i + '" aria-label="Client comment"></td>'];
      return '<tr><td class="frz"><a href="#/creator/' + c.id + '" class="row gap12" style="color:inherit">' + av(c.name, 30, c.seed) + '<span class="col"><b style="font-size:13.5px">' + e(c.name) + '</b><span class="meta" style="font-size:11.5px">' + e(catLabel(c.cat)) + ' · ' + U.short(c.followers) + '</span></span></a></td>' +
        '<td><select class="sel sm" data-ch="rowDeliv" data-p="' + p.id + '" data-i="' + i + '" aria-label="Deliverable">' + DELIVS.map(function(d){ return '<option' + (d === rw.deliv ? ' selected' : '') + (d === 'YouTube' && !c.yt ? ' disabled' : '') + '>' + d + '</option>'; }).join('') + '</select></td>' +
        '<td class="num"><input class="inp sm num" type="number" min="1" max="9" style="width:58px;text-align:right" value="' + (rw.qty || 1) + '" data-ch="rowQty" data-p="' + p.id + '" data-i="' + i + '" aria-label="Quantity"></td>' +
        '<td class="num"><input class="inp sm num" type="number" step="500" style="width:110px;text-align:right" value="' + Math.round(rw.inf) + '" data-ch="rowInf" data-p="' + p.id + '" data-i="' + i + '" aria-label="Influencer price"></td>' +
        '<td class="num"><input class="inp sm num" type="number" step="500" style="width:116px;text-align:right;' + (rw.brand != null ? 'border-color:var(--plum-500)' : '') + '" value="' + Math.round(x.brand / (rw.qty || 1)) + '" data-ch="rowBrand" data-p="' + p.id + '" data-i="' + i + '" aria-label="Brand price" title="' + (rw.brand != null ? 'Manual price. Clear to use the markup rule.' : 'From markup rule') + '"></td>' +
        '<td class="num"><b class="num" style="font-weight:500;color:var(--fig)">' + U.money(x.margin) + '</b><div class="meta" style="font-size:11.5px">' + (x.mPct * 100).toFixed(1) + '%</div></td>' +
        '<td><button class="pill ' + clientCls[rw.client] + '" style="cursor:pointer" data-a="rowClient" data-p="' + p.id + '" data-i="' + i + '" title="Click to change">' + e(rw.client) + '</button></td>' +
        '<td><select class="sel sm" data-ch="rowStage" data-p="' + p.id + '" data-i="' + i + '" aria-label="Stage">' + STAGES.map(function(s){ return '<option' + (s === rw.stage ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></td>' + extra.join('') +
        '<td><div class="row gap4"><button class="ic" data-a="rowMsg" data-id="' + c.id + '" aria-label="WhatsApp" title="WhatsApp">' + ic('msg') + '</button><button class="ic" data-a="rowCounter" data-p="' + p.id + '" data-i="' + i + '" aria-label="Counter-offer" title="Counter-offer">' + ic('swap') + '</button><button class="ic" data-a="rowContract" data-p="' + p.id + '" data-i="' + i + '" aria-label="Contract" title="Contract">' + ic('file') + '</button><button class="ic" data-a="rowPay" data-p="' + p.id + '" data-i="' + i + '" aria-label="Fund escrow" title="Fund escrow">' + ic('lock') + '</button><button class="ic" data-a="rowRemove" data-p="' + p.id + '" data-i="' + i + '" aria-label="Remove" title="Remove">' + ic('trash') + '</button></div></td></tr>'; }).join('');
    var foot = '<tr><td class="frz">Totals · ' + p.rows.length + '</td><td></td><td></td><td class="num">' + U.money(t.inf) + '</td><td class="num">' + U.money(t.brand) + '</td><td class="num">' + U.money(t.margin) + '<div class="meta" style="font-size:11.5px">' + (t.mPct * 100).toFixed(1) + '%</div></td><td>' + U.money(t.approved) + '<div class="meta" style="font-size:11.5px">approved</div></td><td></td>' + cols.map(function(cn){ return '<td class="num">' + (cn === 'Billed incl. GST' ? U.money(t.brand + t.gst) : cn === 'CPV' ? '₹' + t.cpv.toFixed(2) : cn === 'Median views' ? U.short(t.views) : '') + '</td>'; }).join('') + '<td></td></tr>';
    body = '<div class="row wrap between gap12"><div class="seg" role="group" aria-label="Column preset">' + [['finance', 'Finance'], ['performance', 'Performance'], ['outreach', 'Outreach'], ['client', 'Client']].map(function(x){ return '<button class="' + (preset === x[0] ? 'on' : '') + '" data-a="preset" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div><div class="row gap8"><button class="btn out sm" data-a="addRowOpen" data-p="' + p.id + '">' + ic('plus') + 'Add creator</button></div></div>' +
      '<div class="tbl-wrap scroll" style="max-height:70vh"><table class="t" style="min-width:1280px"><thead>' + th + '</thead><tbody>' + rows + '</tbody><tfoot>' + foot + '</tfoot></table></div>' +
      '<div class="note">' + ic('info') + '<span>Clients never see the Influencer ₹ or Margin columns. The swipe link shows brand price, sample reels and audience fit only. Brand prices you type become manual and stop following the markup rule.</span></div>';
  }

};
A.planView = function(el){ S.ui.planView = el.dataset.v; render(); };
A.preset = function(el){ S.ui.preset = el.dataset.v; render(); };
IN.markupLive = function(el){ var l = document.getElementById('mkLabel'); if (l) l.innerHTML = el.value + '<span class="unit">%</span>'; };
CH.markup = function(el){ var p = getPlan(el.dataset.p); var before = planTotals(p).margin; p.markup = +el.value; save(); render(); var after = planTotals(p).margin; toast('Markup ' + p.markup + '%: margin ' + (after >= before ? 'up' : 'down') + ' ' + U.money(Math.abs(after - before)) + ' to ' + U.money(after) + '.', 'trend'); };
function rowOf(el){ var p = getPlan(el.dataset.p); return { p: p, r: p.rows[+el.dataset.i] }; }
CH.rowDeliv = function(el){ var x = rowOf(el); x.r.deliv = el.value; x.r.inf = pkgFor(DATA.byId(x.r.cid), el.value); x.r.brand = null; save(); render(); };
CH.rowQty = function(el){ var x = rowOf(el); x.r.qty = U.clamp(+el.value || 1, 1, 9); save(); render(); };
CH.rowInf = function(el){ var x = rowOf(el); x.r.inf = Math.max(0, +el.value || 0); save(); render(); };
CH.rowBrand = function(el){ var x = rowOf(el); var v = +el.value; x.r.brand = v > 0 ? v : null; save(); render(); };
CH.rowStage = function(el){ var x = rowOf(el); x.r.stage = el.value; save(); render(); };
CH.rowComment = function(el){ var x = rowOf(el); x.r.comment = el.value; save(); };
A.rowClient = function(el){ var x = rowOf(el); var o = ['Pending', 'Approved', 'Maybe', 'Pass']; x.r.client = o[(o.indexOf(x.r.client) + 1) % 4]; save(); render(); };
A.rowRemove = function(el){ var x = rowOf(el); var c = DATA.byId(x.r.cid); x.p.rows.splice(+el.dataset.i, 1); save(); render(); toast(c.name + ' removed from the plan.', 'trash'); };
A.rowMsg = function(el){ A.msgCreator(el); };
A.rowPay = function(el){ var x = rowOf(el), pr = planRow(x.p, x.r); var d = new Date(); S.ledger.unshift({ id: 'm' + Date.now(), date: d.getDate() + ' ' + DATA.MONTHS[d.getMonth()], camp: x.p.client + ' · ' + x.p.name, cid: x.r.cid, gross: pr.inf, status: 'Held', method: 'UPI' }); x.r.stage = x.r.stage === 'Shortlisted' || x.r.stage === 'Reached out' || x.r.stage === 'Negotiating' ? 'Contracted' : x.r.stage; save(); render(); toast(U.money(lineCalc(pr.inf).brand) + ' moved into escrow for ' + pr.c.first + '. They now see “funds secured”.', 'lock'); };
A.planExport = function(el){ var p = getPlan(el.dataset.p); download('CLT-' + p.client.replace(/[^A-Za-z]/g, '').slice(0, 4).toUpperCase() + '-2026-PLAN-v01.csv', csv([['Creator', 'Handle', 'Deliverable', 'Qty', 'Influencer INR', 'Brand INR', 'Margin INR', 'Client', 'Stage', 'Median views', 'CPV']].concat(p.rows.map(function(r){ var x = planRow(p, r); return [x.c.name, '@' + x.c.handle, r.deliv, r.qty || 1, Math.round(x.inf), Math.round(x.brand), Math.round(x.margin), r.client, r.stage, x.c.medViews, x.cpv.toFixed(2)]; })))); toast('Plan exported. Includes margin columns, so keep it internal.', 'download'); };

    { k: 'Platform paid-partnership label', st: paid ? 'ok' : 'warn', d: paid ? 'Switched on.' : 'Turn on Instagram’s paid-partnership label as well as the caption.' },
    { k: 'Video: disclosure in first 3 seconds', st: first ? 'ok' : 'warn', d: first ? 'Verbal or on-screen disclosure confirmed.' : 'Add “Ad” on screen or say it in the first three seconds.' },

/* ============================================================
   Boot: shell wiring, event delegation, keyboard
   ============================================================ */
var DEFER = false, deferT = null;
var _render = render;
render = function(force){ if (DEFER){ clearTimeout(deferT); deferT = setTimeout(function(){ _render(force); }, 140); return; } _render(force); };

document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-a]');
  if (!el) return;
  if (el.hasAttribute('disabled')) return;
  var name = el.getAttribute('data-a'); var fn = A[name]; if (!fn) return;
  var isLink = el.tagName === 'A' && el.getAttribute('href');
  if (!isLink) ev.preventDefault();
  ev.stopPropagation();
  fn(el, ev);
});
document.addEventListener('submit', function(ev){ var f = ev.target.closest('[data-sub]'); if (!f) return; ev.preventDefault(); var fn = A[f.getAttribute('data-sub')]; if (fn) fn(f, ev); });
document.addEventListener('input', function(ev){ var el = ev.target.closest('[data-in]'); if (!el) return; var fn = IN[el.getAttribute('data-in')]; if (fn) fn(el, ev); });
document.addEventListener('change', function(ev){ var el = ev.target.closest('[data-ch]'); if (!el) return; var fn = CH[el.getAttribute('data-ch')]; if (!fn) return; var t = el.type; DEFER = (t === 'number' || t === 'text' || el.tagName === 'TEXTAREA'); try { fn(el, ev); } finally { DEFER = false; } });
document.addEventListener('keydown', function(ev){
  var o = S.ui.overlay;
  if ((ev.metaKey || ev.ctrlKey) && (ev.key === 'k' || ev.key === 'K')){ ev.preventDefault(); if (o && o.type === 'pal') closeOverlay(); else A.openPal(); return; }
  if (ev.key === 'Escape' && o){ ev.preventDefault(); closeOverlay(); return; }
  if (o && o.type === 'pal'){
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){ ev.preventDefault(); o.sel = U.clamp((o.sel || 0) + (ev.key === 'ArrowDown' ? 1 : -1), 0, (o.res || []).length - 1); renderOverlay(); var s = document.querySelector('.pal .it.sel'); if (s && s.scrollIntoView) s.scrollIntoView({ block: 'nearest' }); return; }
    if (ev.key === 'Enter'){ ev.preventDefault(); A.palGo(null); return; }
  }
  var tag = (ev.target.tagName || '').toLowerCase();
  if (!o && parseHash().name === 'client' && tag !== 'input' && tag !== 'textarea'){
    var map = { ArrowRight: 'Approved', ArrowLeft: 'Pass', ArrowDown: 'Maybe' };
    if (map[ev.key]){ var b = document.querySelector('[data-a="swipe"][data-v="' + map[ev.key] + '"]'); if (b){ ev.preventDefault(); b.click(); } return; }
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.hasAttribute && ev.target.hasAttribute('data-a') && tag !== 'button' && tag !== 'a' && tag !== 'input' && tag !== 'textarea' && tag !== 'select'){ ev.preventDefault(); ev.target.click(); }
  if (!o && ev.key === '/' && tag !== 'input' && tag !== 'textarea'){ var q = document.getElementById('discQ') || document.getElementById('lensQ'); if (q){ ev.preventDefault(); q.focus(); } }
});

window.addEventListener('scroll', function(){ document.getElementById('top').classList.toggle('blur', window.scrollY > 8); }, { passive: true });
